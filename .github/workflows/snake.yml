name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2D9C8A&color_dots=#ebedf0,#c6f1e7,#8ee3d1,#4fc9b3,#2d9c8a
            dist/snake-dark.svg?palette=github-dark&color_snake=#7FDBCA&color_dots=#161b22,#1e3a4a,#2b5e72,#4f9fb5,#7fdbca

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
